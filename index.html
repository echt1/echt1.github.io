<!DOCTYPE html>
<html lang="de">
<head> 
<link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>echt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080808;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.22);
  --red: #D50000;
}

html, body {
  height: 100%;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  overflow-x: hidden;
}

/* banner background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('https://look.jmgbb.com/images/GwDUO7ZWqa.png');
  background-size: cover;
  background-position: center;
  filter: brightness(0.35);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  pointer-events: none;
  z-index: 0;
}



/* ── GRID ── */
.grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 210px));
  gap: 10px;
}

@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 210px));
  }
}

@media (max-width: 460px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 160px));
  }
}

/* ── KACHEL ── */
.tile {
  aspect-ratio: 16 / 9;
  border-radius: 18px;
  border: 0.5px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  display: block;
  transition: border-color 0.2s, transform 0.18s, box-shadow 0.2s;
  position: relative;
}

.tile:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

.tile:active {
  transform: scale(0.97);
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease;
}

.tile:hover img {
  transform: scale(1.05);
}

/* shimmer on hover */
.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.2s;
  border-radius: 18px;
}
.tile:hover::after { opacity: 1; }

/* ── REVEAL ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal { animation: fadeUp 0.45s ease both; }
</style>
</head>
<body>

  <nav class="grid" aria-label="Seiten">

    <a href="https://tinyurl.com/echtde" class="tile reveal" style="animation-delay:0.06s" aria-label="echt.de">
      <img src="echtde.png" alt="echt de">
    </a>

    <a href="https://echt1.github.io/countdown" class="tile reveal" style="animation-delay:0.10s" aria-label="Countdown Studio">
      <img src="cdstudiocompact.png" alt="countdownstudio">
    </a>

    <a href="https://echt1.github.io/echtstudios" class="tile reveal" style="animation-delay:0.14s" aria-label="Mediathek der Echt Studios">
      <img src="echtmediathek.png" alt="echtmediathek">
    </a>

    <a href="https://echt1.github.io/list" class="tile reveal" style="animation-delay:0.18s" aria-label="Echt Watchlist">
      <img src="echtlist.png" alt="echtlist">
    </a>

    <a href="https://echt1.github.io/kanban" class="tile reveal" style="animation-delay:0.18s" aria-label="Echt Kanban">
      <img src="kanban.png" alt="echt kanban">
    </a>
<!--
    <a href="http://78.154.103.34:12396/" class="tile reveal" style="animation-delay:0.18s" aria-label="echtbot Dashboard">
      <img src="echtbot.png" alt="echtbot Dashboard">
    </a>
-->

  </nav>

</body>
</html>
